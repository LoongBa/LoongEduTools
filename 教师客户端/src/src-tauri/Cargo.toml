[package]
name = "teacher-client"
version = "0.2.6"
description = "桃李助手 · 龙爸易教·教师端（Tauri 壳）"
authors = ["LoongBa"]
edition = "2021"
# D09 附B：Win7 最后可用 Rust（1.78+ 弃 Win7）——声明 MSRV 使解析器按 1.77.2 挑选依赖版本
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "teacher_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# D09 附B：tauri-build 版本线与 tauri 独立（最新稳定 2.6.3，无 2.11 线），仅构建期参与、
# 不进运行时 → 不随 tauri 锁 <2.12；Win7 运行时兼容由 tauri/wry/tao 决定。"2" 上界由 Cargo.lock 钉死。
tauri-build = { version = "2", features = [] }

[dependencies]
# D09 §6 Win7 锁链：tauri ≥2.11,<2.12（2.12+ 弃 Win7；Rust 锁 1.77.2 见 rust-toolchain.toml）
tauri = { version = ">=2.11, <2.12", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# D08 §2.2（Oracle 点头 B1）：跨窗口全局热键（Alt+T 计时浮层）——本迭代唯一新增 Rust 依赖
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# D02 Oracle 评审：内容包 hash 校验（sha256）
sha2 = "0.10"

# P2 内容分发：最小 zip 解包（自写 central directory 解析 + raw deflate 解压）
# flate2 已在 Cargo.lock（png 传递依赖）——零新增下载，不引入 zip 库
flate2 = "1"

# B1 壳端 ed25519 验签（D04 §3.1 签名链 · S01 §2.2）：ring 已在 Cargo.lock
# （rustls 传递依赖）——零新增下载，对齐 flate2 先例
ring = "0.17"

# P1 认证/口令（D01 §7.2）：HTTPS 调 Workers、凭证 AES-GCM、设备随机数
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5.3"
base64ct = { version = "1.6.0", features = ["alloc"] }

# Win7 WebView2 注册表检测（D02 §3.6）
[target.'cfg(windows)'.dependencies]
winreg = "0.52"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
