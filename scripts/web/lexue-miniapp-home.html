<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="乐学系列 · 专项练习小工具合集（口算 / 记忆 / 专注 / 益智）" />
<title>小工具集 · 乐学系列</title>
<!--
  ⚠ 模板维护约定（UI Agent 美化必读，勿违反）：
  1. 每个注入占位元素（标签 template，data-inject="" 属性，下称「KEY 占位」）恰好出现 1 次，
     脚本按正则整块替换，不可增删/加空格/复制两份。
     - 小工具卡片占位（脚本注入：发布清单全部工具）
     - 更新时间占位（脚本注入）
  2. 链接保持相对路径（../、MiniApp/<工具名>/ 等），禁止绝对路径/盘符。
  3. 纯静态：不引入外部资源，样式内联，随 push 部署。
  4. 美化只改颜色/字体/间距/卡片样式/响应式/品牌感；结构、占位符、链接语义不改。
  5. 本页为 43 款工具目录页，网格展示全部；根首页只放「工具集入口」，不在根首页逐个列工具。
-->
<style>
  :root {
    --brand: #2b5ce6; --bg: #f5f7fb; --card: #ffffff;
    --text: #1f2a44; --muted: #62708c; --border: #e3e8f2; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 12px 0 20px; }
  header .title { font-size: 24px; font-weight: 800; color: var(--brand); }
  header .back a { font-size: 13px; color: var(--muted); text-decoration: none; }
  header .back a:hover { color: var(--brand); }
  section h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { display: block; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-decoration: none; text-align: center; color: inherit; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(43,92,230,.10); }
  .card .name { font-size: 14px; font-weight: 600; }
  .card .go { font-size: 12px; color: var(--brand); }
  footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer a { color: var(--brand); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">专项练习小工具</div>
    <div class="back"><a href="../">← 返回乐学首页</a></div>
  </header>

  <section>
    <h2>全部工具</h2>
    <div class="grid">
      <template data-inject="MINIAPP_CARDS"></template>
    </div>
  </section>

  <footer>
    <span>更新于 <template data-inject="UPDATED_AT"></template></span>
    <span><a href="../">乐学系列 · LoongBa Edu</a></span>
  </footer>
</div>
</body>
</html>
