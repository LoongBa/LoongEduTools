<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="乐学系列 · 专项练习小工具合集（口算 / 记忆 / 专注 / 益智）" />
<title>小工具集 · 乐学系列</title>
<!--
  ⚠ 模板维护约定（UI Agent 美化必读，勿违反）：
  1. 每个注入占位元素（标签 template，data-inject="" 属性，下称「KEY 占位」）恰好出现 1 次，
     脚本按正则整块替换，不可增删/加空格/复制两份。
      - 小工具卡片占位（脚本注入：发布清单全部工具）
      - 更新时间占位（脚本注入）
  2. 链接保持相对路径（../、MiniApp/<工具名>/ 等），禁止绝对路径/盘符。
  3. 纯静态：不引入外部资源，样式内联，随 push 部署。
  4. 美化只改颜色/字体/间距/卡片样式/响应式/品牌感；结构、占位符、链接语义不改。
  5. 本页为 43 款工具目录页，网格展示全部；根首页只放「工具集入口」，不在根首页逐个列工具。
  设计说明：与根首页同一套设计语言（同色系/同字体/同卡片族），品牌 mark 复用「知识火花」内联 SVG；
  注入卡片契约 .card / .card .name / .card .go 已全覆盖。
-->
<style>
  :root {
    --brand: #2b5ce6;
    --brand-deep: #1e3fa8;
    --brand-soft: #6f8fff;
    --accent: #ffa62b;
    --ink: #16213e;
    --muted: #5a6b8c;
    --line: #e3e8f2;
    --card: #ffffff;
    --bg: #f6f8fd;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1000px 360px at 8% -5%, rgba(43,92,230,.08), transparent 60%),
      radial-gradient(900px 320px at 96% -5%, rgba(255,166,43,.06), transparent 55%),
      var(--bg);
    color: var(--ink);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(43,92,230,.18); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 22px 20px 52px; }

  /* ---- 顶部条 ---- */
  header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    padding: 12px 4px 24px;
  }
  header .title {
    display: inline-flex; align-items: center; gap: 11px;
    font-size: 23px; font-weight: 800; letter-spacing: .03em;
    color: var(--ink);
  }
  header .title .mark { width: 30px; height: 30px; filter: drop-shadow(0 4px 8px rgba(43,92,230,.3)); }
  header .title .mark svg { display: block; width: 100%; height: 100%; }

  header .back a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 15px;
    border-radius: 999px;
    font-size: 13px; font-weight: 600;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--line);
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(22,33,62,.04);
    transition: color .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease;
  }
  header .back a:hover {
    color: var(--brand);
    border-color: rgba(43,92,230,.30);
    box-shadow: 0 6px 16px rgba(43,92,230,.10);
    transform: translateX(-2px);
  }

  /* ---- 区块标题 ---- */
  section h2 {
    display: flex; align-items: center; gap: 11px;
    font-size: 17px; font-weight: 800; letter-spacing: .03em;
    margin-bottom: 16px;
  }
  section h2::before {
    content: "";
    width: 8px; height: 20px; border-radius: 6px;
    background: linear-gradient(180deg, var(--brand), var(--brand-deep));
    box-shadow: 0 4px 10px rgba(43,92,230,.30);
  }

  /* ---- 工具网格（构建注入契约：.card / .card .name / .card .go）---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 13px; }
  .card {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
    padding: 18px 14px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    text-decoration: none; color: inherit;
    box-shadow: 0 1px 2px rgba(22,33,62,.04);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
  }
  .card::before {
    content: "";
    position: absolute; left: 50%; top: 0;
    width: 36px; height: 3px;
    border-radius: 0 0 6px 6px;
    background: linear-gradient(90deg, var(--brand), var(--brand-soft));
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity .16s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: rgba(43,92,230,.26);
    box-shadow: 0 12px 28px rgba(43,92,230,.14);
    background: linear-gradient(180deg, #ffffff 0%, #f6faff 100%);
  }
  .card:focus-visible { outline: 2px solid var(--brand-soft); outline-offset: 2px; }
  .card:hover::before { opacity: 1; }
  .card .name { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.35; }
  .card .name::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px; margin-right: 8px;
    border-radius: 50%;
    background: var(--brand);
    opacity: 0;
    transform: scale(.4);
    transition: opacity .16s ease, transform .16s ease;
  }
  .card:hover .name::before { opacity: .55; transform: scale(1); }
  .card .go {
    font-size: 12px; font-weight: 600; line-height: 1;
    color: var(--brand);
    padding: 4px 11px;
    border-radius: 999px;
    background: #eef3ff;
    border: 1px solid rgba(43,92,230,.14);
    transition: background .16s ease, color .16s ease;
  }
  .card:hover .go { background: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(43,92,230,.28); }

  /* ---- Footer ---- */
  footer {
    margin-top: 38px; padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    font-size: 12.5px; color: var(--muted);
  }
  footer .ts { display: inline-flex; align-items: center; gap: 7px; }
  footer .ts::before {
    content: "";
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--brand);
    box-shadow: 0 0 0 0 rgba(43,92,230,.35);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(43,92,230,.35); }
    70%  { box-shadow: 0 0 0 7px rgba(43,92,230,0); }
    100% { box-shadow: 0 0 0 0 rgba(43,92,230,0); }
  }
  footer a { color: var(--brand); font-weight: 600; text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ---- 响应式 ---- */
  @media (max-width: 640px) {
    .wrap { padding: 16px 14px 44px; }
    header { padding: 8px 2px 18px; }
    header .title { font-size: 19px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 11px; }
    footer { justify-content: center; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4a7dff"/>
              <stop offset="1" stop-color="#1e3fa8"/>
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="22" height="22" rx="6.5" fill="url(#lg)"/>
          <path d="M12 5.4c.55 0 1.05.34 1.24.85l1.06 2.89 2.89 1.06c.51.19.85.69.85 1.24 0 .55-.34 1.05-.85 1.24l-2.89 1.06-1.06 2.89a1.34 1.34 0 0 1-1.24.85c-.55 0-1.05-.34-1.24-.85l-1.06-2.89-2.89-1.06a1.34 1.34 0 0 1-.85-1.24c0-.55.34-1.05.85-1.24l2.89-1.06 1.06-2.89c.19-.51.69-.85 1.24-.85Z" fill="#fff"/>
        </svg>
      </span>
      专项练习小工具
    </div>
    <div class="back"><a href="../">← 返回乐学首页</a></div>
  </header>

  <section>
    <h2>全部工具</h2>
    <div class="grid">
      <template data-inject="MINIAPP_CARDS"></template>
    </div>
  </section>

  <footer>
    <span class="ts">更新于 <template data-inject="UPDATED_AT"></template></span>
    <span><a href="../">乐学系列 · LoongBa Edu</a></span>
  </footer>
</div>
</body>
</html>
