<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重绘工作台 — 审核 · 热区</title>
<link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#333}
.header{background:linear-gradient(135deg,#1976D2,#42A5F5);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:14px}
.header h1{font-size:18px}
.header .refresh{margin-left:auto}
.btn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:.15s}
.btn-p{background:#1976D2;color:#fff}.btn-p:hover{background:#1565C0}
.btn-o{background:#fff;border:1px solid #ddd;color:#333}.btn-o:hover{background:#f5f5f5}
.btn-g{background:#4CAF50;color:#fff}.btn-g:hover{background:#388E3C}
.btn-w{background:#FF9800;color:#fff}.btn-w:hover{background:#F57C00}
.task-badge{margin-left:auto;background:#FF9800;color:#fff;padding:4px 12px;border-radius:14px;cursor:pointer;font-size:12px;font-weight:600}
.task-badge:hover{background:#F57C00}
.task-panel{position:fixed;top:56px;right:16px;width:380px;max-height:60vh;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:200;display:flex;flex-direction:column;overflow:hidden}
.task-panel[hidden]{display:none}
.tp-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#FFF3E0;border-bottom:1px solid #e0e0e0;font-size:13px;font-weight:600}
.tp-list{overflow:auto;padding:6px 0}
.tp-item{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12px;border-bottom:1px solid #f5f5f5}
.tp-item .tp-st{width:52px;font-weight:600}
.tp-item .tp-info{flex:1;color:#555}
.tp-item .tp-time{font-size:10px;color:#999}
.st-queued{color:#E65100}.st-running{color:#1976D2}.st-done{color:#2E7D32}.st-failed{color:#C62828}
.book-nav{display:flex;gap:8px;padding:12px 24px;background:#fff;border-bottom:1px solid #e0e0e0;flex-wrap:wrap}
.book-tab{padding:6px 14px;border-radius:16px;background:#f0f1f5;cursor:pointer;font-size:13px;border:1px solid transparent}
.book-tab.active{background:#1976D2;color:#fff}
.container{max-width:1280px;margin:0 auto;padding:20px 24px}
.summary{display:flex;gap:20px;margin-bottom:16px;font-size:13px;color:#666;flex-wrap:wrap}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.unit-card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid #ccc}
.unit-card.has-hz{border-left-color:#FF9800}
.unit-card.allpass{border-left-color:#4CAF50}
.unit-card.hasfail{border-left-color:#F44336}
.unit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.unit-title{font-weight:600;font-size:14px}
.unit-meta{font-size:11px;color:#888;margin-bottom:8px}
.unit-badges{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.b-ok{background:#E8F5E9;color:#2E7D32}.b-fail{background:#FFEBEE;color:#C62828}
.b-pend{background:#FFF3E0;color:#E65100}.b-hz{background:#FFF8E1;color:#F9A825}
.b-val{background:#E3F2FD;color:#1565C0}.b-val-ok{background:#E8F5E9;color:#2E7D32}
.b-val-bad{background:#FFEBEE;color:#C62828}.b-val-mid{background:#FFF3E0;color:#E65100}
.unit-actions{display:flex;gap:8px;flex-wrap:wrap}
.unit-actions a{text-decoration:none}
#workArea{display:none;position:fixed;inset:0;background:#fff;z-index:100;flex-direction:column}
#workArea.show{display:flex}
.wa-top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#2a2a2a;color:#fff;flex-wrap:wrap}
.wa-top .wa-title{font-weight:600;font-size:14px}
.wa-top .wa-views{margin-left:auto;display:flex;gap:8px}
.wa-view-btn{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;background:#444;color:#ccc;border:none}
.wa-view-btn.active{background:#1976D2;color:#fff}
.wa-pub{display:flex;align-items:center;gap:8px;margin-left:8px;flex-wrap:wrap}
.wa-pub .btn{padding:6px 12px;font-size:12px}
.pub-status{font-size:11px;color:#9be29b;max-width:480px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pub-log{font-size:11px;background:#1a1a1a;color:#ccc;border-radius:6px;padding:8px 12px;margin-top:6px;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-all;width:100%}
.pub-log[hidden]{display:none}
#waFrame{flex:1;border:none;min-height:0}
.wa-note{font-size:11px;color:#888;margin-left:6px}
/* V1.3.2：任务日志流式 + 审计弹层 */
.tp-log{background:#fafafa;border-bottom:1px solid #f0f0f0;padding:0 14px 8px;max-height:140px;overflow:auto;font-size:11px;line-height:1.5}
.tp-log pre{margin:0;white-space:pre-wrap;word-break:break-all;font-family:Consolas,Menlo,monospace;color:#555}
.tp-err{color:#C62828;font-size:11px;padding:2px 0;white-space:pre-wrap;word-break:break-all}
#auditModal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:flex;align-items:center;justify-content:center}
#auditModal[hidden]{display:none}
.am-box{background:#fff;border-radius:10px;width:720px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.am-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#E3F2FD;font-weight:600;font-size:14px}
.am-body{overflow:auto;padding:12px 16px;font-family:Consolas,Menlo,monospace;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.am-err{color:#C62828}.am-warn{color:#E65100}.am-ok{color:#2E7D32}.am-line{color:#555}
</style>
</head>
<body>
<header class="header">
  <h1>📚 重绘审核 · 热区修正工作台</h1>
  <span style="font-size:12px;opacity:.85" id="curBookLabel">四年级 上册</span>
  <span class="task-badge" id="taskBadge" onclick="toggleTaskPanel()" title="重绘任务队列（点击查看）">🔄 0/0</span>
  <button class="btn btn-o refresh" onclick="loadStatus()">🔄 刷新</button>
</header>

<div class="task-panel" id="taskPanel" hidden>
  <div class="tp-head">
    <span>🔄 重绘任务队列（后台执行 · 强化提示词）</span>
    <button class="btn btn-o" onclick="clearTasks()">🗑 清空已完成</button>
  </div>
  <div class="tp-list" id="taskList"><div style="color:#999">加载中…</div></div>
</div>

<div class="book-nav" id="bookNav"></div>

<div class="container">
  <div class="summary" id="summary"></div>
  <div class="unit-grid" id="unitGrid"></div>
</div>

<div id="workArea">
  <div class="wa-top">
    <button class="btn btn-o" onclick="backHome()">← 返回汇总</button>
    <span class="wa-title" id="waTitle">—</span>
    <span class="wa-note" id="waNote"></span>
    <div class="wa-pub">
      <button class="btn btn-w" onclick="doPromote()" title="把审核通过的页面从任务输出复制到重绘目录">⬆️ 提材通过页</button>
      <button class="btn btn-p" onclick="doRebuild()" title="重建当前单元点读 zip">🔨 重建单元</button>
      <button class="btn btn-w" onclick="doAudit()" title="对当前单元产物运行体积/文本门禁审计与合规自查">🔍 审计</button>
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <span class="pub-status" id="pubStatus"></span>
        <pre class="pub-log" id="pubLog" hidden></pre>
      </div>
    </div>
    <div class="wa-views">
      <button class="wa-view-btn active" id="vwReview" onclick="switchView('review')">📋 审核</button>
      <button class="wa-view-btn" id="vwHotzone" onclick="switchView('hotzone')">🔧 热区</button>
      <button class="btn btn-g" onclick="openTest()">🧪 测试</button>
    </div>
  </div>
  <iframe id="waFrame" src="about:blank"></iframe>
</div>

<!-- V1.3.2：审计结果弹层（audit + compliance 的 ERROR/WARN 行列表） -->
<div id="auditModal" hidden>
  <div class="am-box">
    <div class="am-head"><span>🔍 审计结果</span><button class="btn btn-o" onclick="closeAuditModal()">✕ 关闭</button></div>
    <div class="am-body" id="auditBody"></div>
  </div>
</div>

<script>
const BOOKS = [
  { key: "一年级_上册", grade: "一年级", vol: "上册" }, { key: "一年级_下册", grade: "一年级", vol: "下册" },
  { key: "二年级_上册", grade: "二年级", vol: "上册" }, { key: "二年级_下册", grade: "二年级", vol: "下册" },
  { key: "三年级_上册", grade: "三年级", vol: "上册" }, { key: "三年级_下册", grade: "三年级", vol: "下册" },
  { key: "四年级_上册", grade: "四年级", vol: "上册" }, { key: "四年级_下册", grade: "四年级", vol: "下册" },
  { key: "五年级_上册", grade: "五年级", vol: "上册" }, { key: "五年级_下册", grade: "五年级", vol: "下册" },
  { key: "六年级_上册", grade: "六年级", vol: "上册" },
];
let curBook = "四年级_上册";
let curUnit = 0;
let curView = "review";
let STATUS = null;

function esc(s){ return String(s == null ? "" : s); }
function fmtTime(t){ return t ? esc(t) : "—"; }
function unitNo(title){
  const m = /Unit\s*(\d+)/i.exec(title || "");
  if (m) return m[1];
  const low = (title || "").toLowerCase();
  if (low.startsWith("revision")) return "复习";
  if (low.startsWith("appendix")) { const a = /appendix\s*(\d+)/i.exec(title); return "附录" + (a ? a[1] : ""); }
  return "1";
}

async function loadStatus(){
  try {
    const r = await fetch("/api/status?book=" + encodeURIComponent(curBook));
    if (!r.ok) throw new Error("HTTP " + r.status);
    STATUS = await r.json();
    document.getElementById("curBookLabel").textContent = STATUS.grade + STATUS.vol;
    renderUnits();
  } catch (e) {
    document.getElementById("unitGrid").innerHTML =
      `<div style="color:#C62828;padding:20px">❌ 状态加载失败: ${esc(e.message)}（请通过 启动热区校正.bat 启动服务访问）</div>`;
  }
}

function renderUnits(){
  const grid = document.getElementById("unitGrid");
  const sum = document.getElementById("summary");
  if (!STATUS || !STATUS.units) { grid.innerHTML = '<div style="color:#999">（无单元数据）</div>'; return; }
  if (!STATUS.units.length) {
    grid.innerHTML = '<div style="color:#999;padding:20px">该册尚无重绘数据（未复制 书数据.json 副本 / 未开始重绘）。<br>请先在素材目录建 <code>_重绘图片素材/书数据.json</code> 或运行重绘流程。</div>';
    sum.innerHTML = `<span>图片数据：${fmtTime(STATUS.img_updated_at)}</span>`;
    return;
  }
  let tDone = 0, tPass = 0, tFail = 0, tHz = 0;
  grid.innerHTML = "";
  STATUS.units.forEach(u => {
    const rv = u.review || {};
    tDone += rv.done || 0; tPass += rv.pass || 0; tFail += rv.fail || 0;
    if (u.hotzone) tHz++;
    const no = unitNo(u.title);
    const cls = (rv.fail > 0) ? "hasfail" : (rv.done > 0 && rv.fail === 0) ? "allpass" : (u.hotzone ? "has-hz" : "");
    const card = document.createElement("div");
    card.className = "unit-card " + cls;
    const passBadge = (rv.pass > 0) ? `<span class="badge b-ok">✅${rv.pass}通过</span>` : "";
    const failBadge = (rv.fail > 0) ? `<span class="badge b-fail">❌${rv.fail}需重绘</span>` : "";
    const pend = (u.pages - (rv.done || 0)) > 0 ? `<span class="badge b-pend">⬜${u.pages - rv.done}待审</span>` : "";
    const hzBadge = u.hotzone ? `<span class="badge b-hz">🔧热区 ${fmtTime(u.hotzone.updated_at).slice(5)}</span>` : `<span class="badge b-pend">热区未校</span>`;
    // 校验状态：热区坐标（自动）+ 音频覆盖（缓存/按需）
    const v = u.validation || {};
    let hzVal = "";
    if (v.hz_issues === -1) hzVal = `<span class="badge b-val" title="热区坐标校验：数据异常无法计算">⚠️热区异常</span>`;
    else if (v.hz_issues > 0) hzVal = `<span class="badge b-val-bad" title="热区坐标异常（超界/倒置/零面积）">⚠️热区 ${v.hz_issues}</span>`;
    else hzVal = `<span class="badge b-val-ok" title="热区坐标全部合法">📐热区 ✓</span>`;
    let auVal = "";
    if (v.audio_missing === null || v.audio_missing === undefined)
      auVal = `<span class="badge b-val clickable" onclick="validateUnit(${u.index})" style="cursor:pointer" title="点击校验音频覆盖">🔇未校验</span>`;
    else if (v.audio_missing > 0)
      auVal = `<span class="badge b-val-bad" title="音频缺失（点击重校验）">🔇缺音频 ${v.audio_missing}</span>`;
    else
      auVal = `<span class="badge b-val-ok" title="音频覆盖完整">🔊音频 ✓</span>`;
    // 书页完整性校验（V1.3.2）：serve 下发 page_issues（缺页+双缺图计数）；-1=数据异常无法计算
    let pgVal = "";
    const pgi = Number(v.page_issues);
    const pzt = Number(v.page_zt);
    if (pgi === -1 || pzt === -1) {
      pgVal = `<span class="badge b-val-bad" title="书页完整性：数据异常无法计算">⚠️ 页异常</span>`;
    } else {
      if (pgi > 0) pgVal += `<span class="badge b-val-bad" title="书页缺失（缺页/双缺图）">📄 缺页 ${pgi}</span>`;
      if (pzt > 0) pgVal += `<span class="badge b-val-mid" title="零 track 页（可能为扉页，可人工放行）">📄 零track ${pzt}</span>`;
      if (!pgVal && !isNaN(pgi)) pgVal = `<span class="badge b-val-ok" title="书页完整">📄 完整</span>`;
    }
    card.innerHTML = `
      <div class="unit-head"><span class="unit-title">${esc(u.title)}</span><span style="font-size:11px;color:#999">${u.pages} 页</span></div>
      <div class="unit-meta">页 ${u.start}-${u.end - 1}${u.hotzone ? " · " + esc(u.hotzone.file) : ""}</div>
      <div class="unit-badges">${passBadge}${failBadge}${pend}${hzBadge}${hzVal}${auVal}${pgVal}</div>
      <div class="unit-actions">
        <button class="btn btn-p" onclick="openUnit(${u.index},'review')">📋 审核</button>
        <button class="btn btn-w" onclick="openUnit(${u.index},'hotzone')">🔧 热区</button>
        <button class="btn btn-g" onclick="openUnit(${u.index},'test')">🧪 测试</button>
      </div>`;
    grid.appendChild(card);
  });
  sum.innerHTML = `<span>图片数据：${fmtTime(STATUS.img_updated_at)}</span>
    <span>审核：✅${tPass} 通过 / ❌${tFail} 需重绘 / ⬜${Math.max(0, tDone - tPass - tFail)} 待审</span>
    <span>热区校正：${tHz}/${STATUS.units.length} 单元</span>`;
}

function renderBookNav(){
  const nav = document.getElementById("bookNav");
  nav.innerHTML = "";
  BOOKS.forEach(b => {
    const t = document.createElement("span");
    t.className = "book-tab" + (b.key === curBook ? " active" : "");
    t.textContent = b.grade + b.vol;
    t.onclick = () => { curBook = b.key; renderBookNav(); loadStatus(); };
    nav.appendChild(t);
  });
}

/* ---- 单元工作台（iframe 双视图） ---- */
function openUnit(ui, view){
  curUnit = ui;
  const u = STATUS.units[ui];
  document.getElementById("workArea").classList.add("show");
  document.getElementById("waTitle").textContent = `${STATUS.grade}${STATUS.vol} · ${u.title}`;
  // 单元发布摘要（M5：图片/热区/审核/构建状态）
  const rv = u.review || {};
  document.getElementById("waNote").textContent =
    `图片 ${STATUS.img_updated_at} | 热区 ${u.hotzone ? u.hotzone.updated_at : "未校正"} | ` +
    `审核 ${rv.pass || 0}✓/${rv.fail || 0}✗/${Math.max(0, u.pages - (rv.done || 0))}待审`;
  document.getElementById("pubStatus").textContent = "";
  switchView(view === "test" ? "test" : view);
}
function backHome(){
  document.getElementById("workArea").classList.remove("show");
  document.getElementById("waFrame").src = "about:blank";
}
function unitNoOf(u){ return unitNo(u.title); }
function switchView(view){
  curView = view;
  document.getElementById("vwReview").classList.toggle("active", view === "review");
  document.getElementById("vwHotzone").classList.toggle("active", view === "hotzone");
  const u = STATUS.units[curUnit];
  const bookKey = curBook;
  const frame = document.getElementById("waFrame");
  document.getElementById("pubLog").hidden = true;
  if (view === "review") {
    frame.src = `../qa_reports/${bookKey}.html?unit=${curUnit}`;
    document.getElementById("waNote").textContent = "审核：左右图对比 · 中间操作 · 自动下一张 · 可标矩形";
  } else if (view === "hotzone") {
    frame.src = `../hotzone_editor/index.html?book=${encodeURIComponent(bookKey)}&unit=${curUnit}`;
    document.getElementById("waNote").textContent = "热区：拖动/缩放热区 · 播放验证 · 保存到重绘目录";
  } else {
    openTest(u);
  }
}
function openTest(u){
  // 测试链接：app_name 由服务端权威下发（前缀 BOOK_MAP 派生 + 单元序号），前端不再自行拼装
  u = u || STATUS.units[curUnit];
  const appName = u && u.app_name;
  if (!appName) { showPub("❌ 无 app_name（服务端未下发）"); return; }
  const url = `../../publish/学科/${appName}_解压测试版/index.html`;
  fetch(url, { method: "HEAD", cache: "no-store" })
    .then(r => {
      if (r.ok) { window.open(url, "_blank"); }
      else {
        showPub(`⚠️ 未找到解压测试版（${appName}）。请先「🔨 重建单元」生成产物后再测。`);
        document.getElementById("waNote").textContent = "测试：产物未构建";
      }
    })
    .catch(() => {
      showPub(`⚠️ 探测失败（${appName}）。可尝试手动打开: ${url}`);
      document.getElementById("waNote").textContent = "测试：探测失败";
    });
}
function showPub(msg){
  const st = document.getElementById("pubStatus");
  st.textContent = msg;
  st.style.whiteSpace = "normal";
}

/* ---- 校验（V1.3.1）：音频覆盖按需校验 + 结果刷新 ---- */
async function validateUnit(ui){
  const st = document.getElementById("pubStatus");
  st.textContent = "🔍 校验音频覆盖中…（需数秒）";
  try {
    const res = await fetch("/api/validate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ book: curBook, unit: ui }),
    });
    const j = await res.json();
    if (j.ok) {
      const r = j.results[0];
      st.textContent = r
        ? `✅ 校验完成：热区 ${r.hz_issues} 异常 / 音频 ${r.audio_missing}/${r.audio_total} 缺失`
        : "✅ 校验完成";
      loadStatus();
    } else {
      st.textContent = "❌ " + (j.error || "校验失败");
    }
  } catch (e) { st.textContent = "❌ " + e.message; }
}

/* ---- 发布操作（M4：提材 / 重建，闭环） ---- */
async function doPromote(){
  const st = document.getElementById("pubStatus");
  st.textContent = "⬆️ 提材中…";
  try {
    const res = await fetch("/api/promote", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ book: curBook }),
    });
    const j = await res.json();
    st.textContent = j.ok
      ? `⬆️ 提材 ${j.promoted.length} 页` + (j.missing.length ? `，缺 ${j.missing.length} 页（${j.missing.join(",")}）` : "")
      : "❌ " + (j.error || "");
    loadStatus();
  } catch (e) { st.textContent = "❌ " + e.message; }
}
async function doRebuild(){
  const st = document.getElementById("pubStatus");
  const log = document.getElementById("pubLog");
  st.textContent = "🔨 重建中…（约 1-2 分钟）";
  st.style.whiteSpace = "nowrap";
  log.hidden = true;
  try {
    const res = await fetch("/api/rebuild", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tool: "英语点读", units: [curUnit] }),
    });
    const j = await res.json();
    if (j.ok) {
      st.textContent = "✅ " + (j.status || "构建完成");
      st.style.whiteSpace = "nowrap";
    } else {
      const tail = j.tail || j.error || "构建失败";
      st.textContent = "❌ " + (j.error || "构建失败") + " · 📋 查看日志";
      st.style.whiteSpace = "nowrap";
      st.style.cursor = "pointer";
      log.textContent = tail;
      log.hidden = false;
      st.onclick = () => { log.hidden = !log.hidden; };
    }
  } catch (e) { st.textContent = "❌ " + e.message; }
}

/* ---- 审计（V1.3.2）：体积/文本门禁 + 合规自查，一键展示 ERROR/WARN ---- */
function auditLines(block){
  if (!block) return [];
  if (typeof block === "string") return block.split("\n");
  if (Array.isArray(block)) return block.map(String);
  const out = [];
  ["errors", "warnings", "failed", "passed"].forEach(k => {   // 与 _api_audit 返回字段对齐（failed/passed 汇总行）
    const v = block[k];
    if (v === null || v === undefined) return;
    if (Array.isArray(v)) v.forEach(x => out.push(String(x)));
    else out.push(String(v));
  });
  return out;
}
function showAuditModal(j, errMsg){
  const body = document.getElementById("auditBody");
  let html = "";
  if (errMsg) {
    html = `<div class="am-err">${esc(errMsg)}</div>`;
  } else {
    const lines = auditLines(j.audit).concat(auditLines(j.compliance));
    if (!lines.length && j.tail) lines.push(...String(j.tail).split("\n"));
    if (!lines.length) {
      html = `<div class="am-ok">✅ 未发现问题（无 ERROR / WARN 输出）</div>`;
    } else {
      lines.forEach(l => {
        const s = String(l);
        const cls = /^ERROR[:：]|^FAILED/.test(s) ? "am-err" : /^WARN[:：]/.test(s) ? "am-warn" : /^PASS/.test(s) ? "am-ok" : "am-line";
        html += `<div class="${cls}">${esc(s)}</div>`;
      });
    }
  }
  body.innerHTML = html;
  document.getElementById("auditModal").hidden = false;
}
function closeAuditModal(){ document.getElementById("auditModal").hidden = true; }
async function doAudit(){
  const st = document.getElementById("pubStatus");
  const u = STATUS && STATUS.units && STATUS.units[curUnit];
  if (!u) { showAuditModal(null, "❌ 无当前单元（请先刷新状态）"); return; }
  st.textContent = "🔍 审计当前产物中…";
  st.style.whiteSpace = "nowrap";
  try {
    // target：当前选中单元对应 dist 产物 zip（照 /api/rebuild 同款参数，后端以 target 为准、tool/units 供回退解析）
    const target = "dist/学科/英语点读/" + (u.app_name || "unit" + (curUnit + 1)) + ".zip";
    const res = await fetch("/api/audit", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target: target, tool: "英语点读", units: [curUnit], book: curBook }),
    });
    const j = await res.json();
    if (!res.ok) {
      showAuditModal(null, "❌ HTTP " + res.status + " " + (j.error || ""));
      st.textContent = "❌ 审计失败";
      return;
    }
    showAuditModal(j, null);
    st.textContent = "🔍 审计完成（点开结果弹层查看 ERROR/WARN）";
  } catch (e) {
    st.textContent = "❌ 审计请求失败";
    showAuditModal(null, "❌ " + e.message);
  }
}
let taskTimer = null;
const ST_LABEL = { queued: "⏳队列", running: "🔨进行", done: "✅完成", failed: "❌失败" };
// V1.3.2 日志流式：每任务已渲染行数 + 日志容器（按 任务名|页码 复用，避免全量重写清空已渲染日志）
window.__lastLogLen = {};
const taskLogEls = {};
function taskKey(t){ return t.task + "|" + t.page; }
async function refreshTasks(){
  try {
    const r = await fetch("/api/tasks");
    const j = await r.json();
    document.getElementById("taskBadge").textContent = `🔄 ${j.queue}/${j.done}`;
    const list = document.getElementById("taskList");
    if (!j.tasks.length) {
      list.innerHTML = '<div style="color:#999;padding:10px 14px">（暂无任务）</div>';
      Object.keys(taskLogEls).forEach(k => delete taskLogEls[k]);
      window.__lastLogLen = {};
      return;
    }
    // 状态行全量刷新 + 日志区增量 append（复用日志容器，自动滚动到底）
    const seen = {};
    list.innerHTML = "";
    j.tasks.forEach(t => {
      const key = taskKey(t);
      seen[key] = true;
      const st = ST_LABEL[t.status] || t.status;
      const time = t.status === "queued" ? t.created_at.slice(5, 16) : (t.done_at || t.started_at || "").slice(5, 16);
      const item = document.createElement("div");
      item.className = "tp-item";
      item.innerHTML = `<span class="tp-st st-${t.status}">${st}</span>
        <span class="tp-info">${esc(t.task)} · P${t.page}</span>
        <span class="tp-time">${esc(time)}</span>`;
      list.appendChild(item);
      // 日志容器（按任务键复用，不清空重建 → __lastLogLen 精确）
      let logEl = taskLogEls[key];
      if (!logEl) {
        logEl = document.createElement("div");
        logEl.className = "tp-log";
        logEl.appendChild(document.createElement("pre"));
        taskLogEls[key] = logEl;
      }
      // 失败任务 error 摘要（状态变化时更新）
      const errEl = logEl.querySelector(".tp-err");
      if (t.status === "failed" && t.error) {
        if (!errEl) {
          const er = document.createElement("div");
          er.className = "tp-err";
          er.textContent = "❌ " + t.error;
          logEl.insertBefore(er, logEl.firstChild);
        } else { errEl.textContent = "❌ " + t.error; }
      } else if (errEl) { errEl.remove(); }
      // 增量 append 新增日志行（j.tasks 每项 logs 数组切片）
      const pre = logEl.querySelector("pre");
      const logs = t.logs || [];
      const last = window.__lastLogLen[key] || 0;
      if (logs.length > last) {
        // 正常增量：只 append 新增行
        for (let k = last; k < logs.length; k++) {
          pre.appendChild(document.createTextNode((k === last ? "" : "\n") + logs[k]));
        }
        window.__lastLogLen[key] = logs.length;
      } else {
        // 后端 [-200:] 截断滚动（logs >200 行被裁剪，长度不再单调增长）→ 全量重设防新行丢失
        pre.textContent = logs.join("\n");
        window.__lastLogLen[key] = logs.length;
      }
      logEl.scrollTop = logEl.scrollHeight;      // 自动滚动到底
      list.appendChild(logEl);
    });
    // 清理已消失任务（完成被清空）的容器与计数
    Object.keys(taskLogEls).forEach(k => {
      if (!seen[k]) { delete taskLogEls[k]; delete window.__lastLogLen[k]; }
    });
  } catch (e) { /* 服务未启动 */ }
}
function toggleTaskPanel(){
  const p = document.getElementById("taskPanel");
  p.hidden = !p.hidden;
  if (!p.hidden) refreshTasks();
}
async function clearTasks(){
  await fetch("/api/tasks/clear", { method: "POST" });
  refreshTasks();
}
// 轮询任务状态 + iframe 通知（审核视图发重绘后立即刷新）
setInterval(refreshTasks, 5000);
window.addEventListener("message", e => {
  const t = e.data && e.data.type;
  if (t === "redraw_sent") refreshTasks();
  else if (t === "hotzone_saved") loadStatus();                       // 热区保存回传刷新
  else if (t === "unit_review_done") {                                // 审核单元完成衔接
    const nu = curUnit + 1;
    if (STATUS && STATUS.units && nu < STATUS.units.length) openUnit(nu, "review");
    else { backHome(); alert("本册全部单元审核完成 🎉"); loadStatus(); }
  }
});
